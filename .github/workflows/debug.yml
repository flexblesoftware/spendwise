name: Build Debug APK

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  build-debug:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Accept Android SDK Licenses
        run: |
          yes | sdkmanager --licenses || true

      - name: Setup Gradle 8.11.1
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.11.1-bin.zip
          unzip -q gradle-8.11.1-bin.zip
          ./gradle-8.11.1/bin/gradle wrapper
          chmod +x gradlew

      - name: Run Unit Tests
        run: |
          ./gradlew testDebugUnitTest --stacktrace 2>&1 | tee test.log

      - name: Build Debug APK
        run: |
          ./gradlew assembleDebug --stacktrace 2>&1 | tee build.log

      - name: Post Failure Log to PR
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let log = '';
            if (fs.existsSync('test.log')) {
              const content = fs.readFileSync('test.log', 'utf8');
              log += '### testDebugUnitTest Output (tail):\n```\n' + content.slice(-4000) + '\n```\n';
            }
            if (fs.existsSync('build.log')) {
              const content = fs.readFileSync('build.log', 'utf8');
              log += '### assembleDebug Output (tail):\n```\n' + content.slice(-4000) + '\n```\n';
            }
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 1,
              body: '🚨 **CI Failure Details:**\n\n' + log
            });

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SpendWise-debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
