name: Release Signed APK

on:
  push:
    tags:
      - 'v*.*.*'
    branches:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Calculate Version Code and Name
        id: versioning
        run: |
          TAG="${GITHUB_REF##*/}"
          case "$TAG" in
            v*.*.*) ;;
            *) TAG="v1.0.3" ;;
          esac
          VERSION_CLEAN="${TAG#v}"
          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION_CLEAN"
          MAJOR=${MAJOR:-1}
          MINOR=${MINOR:-0}
          PATCH=${PATCH:-3}
          RUN_NUM="${{ github.run_number }}"
          VERSION_CODE=$(( (MAJOR * 10000 + MINOR * 100 + PATCH) * 100 + (RUN_NUM % 100) ))
          echo "TAG=$TAG" >> $GITHUB_ENV
          echo "VERSION_NAME=$VERSION_CLEAN" >> $GITHUB_ENV
          echo "VERSION_CODE=$VERSION_CODE" >> $GITHUB_ENV
          echo "Tag: $TAG, VersionName: $VERSION_CLEAN, VersionCode: $VERSION_CODE"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Accept Android SDK Licenses
        run: |
          yes | sdkmanager --licenses || true

      - name: Setup Gradle 8.11.1
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.11.1-bin.zip
          unzip -q gradle-8.11.1-bin.zip
          echo "$GITHUB_WORKSPACE/gradle-8.11.1/bin" >> $GITHUB_PATH
          sudo ln -sf "$GITHUB_WORKSPACE/gradle-8.11.1/bin/gradle" /usr/local/bin/gradle
          gradle --version

      - name: Decode or Restore Fixed Release Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          rm -f spendwise-release.jks temp-keystore.jks
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Decoding fixed release keystore from KEYSTORE_BASE64 secret..."
            echo "$KEYSTORE_BASE64" | base64 -d > spendwise-release.jks
            STORE_PASS="${KEYSTORE_PASSWORD:-SwKeyStore2026!7xQm9K4vLpW}"
            KEY_PASS="${KEY_PASSWORD:-$STORE_PASS}"
            ALIAS="${KEY_ALIAS:-spendwise}"
          else
            echo "Checking for persistent keystore on signing-keystore branch..."
            KEYSTORE_RESTORED=0
            if git fetch origin signing-keystore:refs/remotes/origin/signing-keystore 2>/dev/null; then
              if git show origin/signing-keystore:spendwise-release.jks > temp-keystore.jks 2>/dev/null && [ -s temp-keystore.jks ]; then
                mv temp-keystore.jks spendwise-release.jks
                KEYSTORE_RESTORED=1
                echo "Reused existing persistent release keystore from signing-keystore branch!"
              fi
            fi
            rm -f temp-keystore.jks

            STORE_PASS="${KEYSTORE_PASSWORD:-SwKeyStore2026!7xQm9K4vLpW}"
            KEY_PASS="${KEY_PASSWORD:-$STORE_PASS}"
            ALIAS="${KEY_ALIAS:-spendwise}"

            if [ "$KEYSTORE_RESTORED" -eq 0 ]; then
              echo "Generating fixed release keystore..."
              keytool -genkeypair -v -keystore spendwise-release.jks -alias "$ALIAS" \
                -keyalg RSA -keysize 2048 -validity 10000 \
                -storepass "$STORE_PASS" -keypass "$KEY_PASS" \
                -dname "CN=MD Shahid, OU=SpendWise, O=SpendWise, L=Termux, ST=State, C=IN"
              
              # Persist keystore to dedicated branch so updates never fail with signature mismatch
              git config user.name "github-actions[bot]"
              git config user.email "github-actions[bot]@users.noreply.github.com"
              git worktree add /tmp/keystore-worktree -B signing-keystore 2>/dev/null || git checkout -B signing-keystore
              if [ -d /tmp/keystore-worktree ]; then
                cp spendwise-release.jks /tmp/keystore-worktree/
                (cd /tmp/keystore-worktree && git add -f spendwise-release.jks && git commit -m "chore: persist fixed release keystore across builds" && git push -f origin signing-keystore) || true
                git worktree remove --force /tmp/keystore-worktree || true
              else
                git add -f spendwise-release.jks
                git commit -m "chore: persist fixed release keystore across builds" || true
                git push -f origin signing-keystore || true
                git checkout - || true
              fi
            fi
          fi
          echo "KEYSTORE_PASSWORD=$STORE_PASS" >> $GITHUB_ENV
          echo "KEY_PASSWORD=$KEY_PASS" >> $GITHUB_ENV
          echo "KEY_ALIAS=$ALIAS" >> $GITHUB_ENV
          ls -la spendwise-release.jks

      - name: Bundle Real Typography & Offline Assets
        run: |
          mkdir -p app/src/main/res/font
          echo "Downloading official UI font families from Google Fonts repository..."
          curl -sSL -L "https://raw.githubusercontent.com/google/fonts/main/ofl/inter/Inter%5Bopsz%2Cwght%5D.ttf" -o app/src/main/res/font/inter.ttf || true
          curl -sSL -L "https://raw.githubusercontent.com/google/fonts/main/ofl/outfit/Outfit%5Bwght%5D.ttf" -o app/src/main/res/font/outfit.ttf || true
          curl -sSL -L "https://raw.githubusercontent.com/google/fonts/main/ofl/plusjakartasans/PlusJakartaSans%5Bwght%5D.ttf" -o app/src/main/res/font/plus_jakarta_sans.ttf || true
          curl -sSL -L "https://raw.githubusercontent.com/google/fonts/main/ofl/jetbrainsmono/JetBrainsMono%5Bwght%5D.ttf" -o app/src/main/res/font/jetbrains_mono.ttf || true
          for f in app/src/main/res/font/*.ttf; do
            if [ -f "$f" ]; then
              if head -c 20 "$f" | grep -qi "<!DOCTYPE\|<html"; then
                echo "Removing non-binary font download: $f"
                rm -f "$f"
              fi
            fi
          done
          ls -lh app/src/main/res/font/ || true

      - name: Generate High-Precision Launcher & Store Icons
        run: |
          pip install --quiet pillow
          python3 scripts/generate_launcher_icons.py

      - name: Run Unit Tests
        run: |
          set -eo pipefail
          gradle testDebugUnitTest --stacktrace 2>&1 | tee test.log

      - name: Build Signed Release APK
        env:
          KEYSTORE_FILE: ${{ github.workspace }}/spendwise-release.jks
          KEYSTORE_PASSWORD: ${{ env.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ env.KEY_ALIAS }}
          KEY_PASSWORD: ${{ env.KEY_PASSWORD }}
          VERSION_NAME: ${{ env.VERSION_NAME }}
          VERSION_CODE: ${{ env.VERSION_CODE }}
        run: |
          set -eo pipefail
          gradle assembleRelease --stacktrace 2>&1 | tee release.log

      - name: Prepare Release Asset
        run: |
          APK_PATH=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "Error: Release APK not found!"
            exit 1
          fi
          ASSET_NAME="SpendWise-${TAG}.apk"
          cp "$APK_PATH" "$ASSET_NAME"
          echo "ASSET_NAME=$ASSET_NAME" >> $GITHUB_ENV
          echo "Generated APK: $ASSET_NAME"
          ls -lh "$ASSET_NAME"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: SpendWise ${{ env.TAG }}
          tag_name: ${{ env.TAG }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            ${{ env.ASSET_NAME }}
            play_store_512.png

      - name: Upload Logs to Branch
        if: always()
        run: |
          mkdir -p ci-logs
          echo "Job Status: ${{ job.status }}" > ci-logs/status.txt
          echo "TAG=$TAG, VERSION_NAME=$VERSION_NAME, VERSION_CODE=$VERSION_CODE" >> ci-logs/status.txt
          ls -lh SpendWise-*.apk >> ci-logs/status.txt 2>&1 || true
          sha256sum SpendWise-*.apk >> ci-logs/status.txt 2>&1 || true
          ls -la spendwise-release.jks >> ci-logs/status.txt 2>&1 || true
          ls -la play_store_512.png >> ci-logs/status.txt 2>&1 || true
          ls -la app/src/main/res/mipmap-* >> ci-logs/status.txt 2>&1 || true
          [ -f test.log ] && cp test.log ci-logs/test.log || echo "No test.log" > ci-logs/test.log
          [ -f release.log ] && cp release.log ci-logs/release.log || echo "No release.log" > ci-logs/release.log
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B ci-debug-log
          git add ci-logs
          git commit -m "CI logs for run ${{ github.run_id }}" || true
          git push -f origin ci-debug-log || true
