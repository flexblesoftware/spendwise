name: Release Signed APK

on:
  push:
    tags:
      - 'v*.*.*'
    branches:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Calculate Version Code and Name
        id: versioning
        run: |
          RAW_REF="${GITHUB_REF#refs/tags/}"
          TAG="${RAW_REF#refs/heads/}"
          echo "TAG=$TAG" >> $GITHUB_ENV
          VERSION_CLEAN="${TAG#v}"
          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION_CLEAN"
          MAJOR=${MAJOR:-1}
          MINOR=${MINOR:-0}
          PATCH=${PATCH:-0}
          VERSION_CODE=$((MAJOR * 10000 + MINOR * 100 + PATCH))
          echo "VERSION_NAME=$VERSION_CLEAN" >> $GITHUB_ENV
          echo "VERSION_CODE=$VERSION_CODE" >> $GITHUB_ENV
          echo "Tag: $TAG, VersionName: $VERSION_CLEAN, VersionCode: $VERSION_CODE"

      - name: Decode or Generate Release Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Decoding release keystore from KEYSTORE_BASE64 secret..."
            echo "$KEYSTORE_BASE64" | base64 -d > spendwise-release.jks
          else
            echo "KEYSTORE_BASE64 secret not found in repository settings; creating release keystore with backed up credentials..."
            STORE_PASS="${KEYSTORE_PASSWORD:-SwKeyStore2026!7xQm9K4vLpW}"
            KEY_PASS="${KEY_PASSWORD:-SwKeyAlias2026!9rVn8B3cTxM}"
            ALIAS="${KEY_ALIAS:-spendwise}"
            keytool -genkeypair -v -keystore spendwise-release.jks -alias "$ALIAS" \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$STORE_PASS" -keypass "$KEY_PASS" \
              -dname "CN=MD Shahid, OU=SpendWise, O=SpendWise, L=Termux, ST=State, C=IN"
            echo "KEYSTORE_PASSWORD=$STORE_PASS" >> $GITHUB_ENV
            echo "KEY_PASSWORD=$KEY_PASS" >> $GITHUB_ENV
            echo "KEY_ALIAS=$ALIAS" >> $GITHUB_ENV
          fi

      - name: Generate Gradle Wrapper
        run: |
          gradle wrapper --gradle-version 8.11.1
          chmod +x gradlew

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Build Signed Release APK
        env:
          KEYSTORE_FILE: ${{ github.workspace }}/spendwise-release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || env.KEYSTORE_PASSWORD || 'SwKeyStore2026!7xQm9K4vLpW' }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || env.KEY_ALIAS || 'spendwise' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || env.KEY_PASSWORD || 'SwKeyAlias2026!9rVn8B3cTxM' }}
          VERSION_NAME: ${{ env.VERSION_NAME }}
          VERSION_CODE: ${{ env.VERSION_CODE }}
        run: |
          ./gradlew assembleRelease --stacktrace

      - name: Prepare Release Asset
        run: |
          APK_PATH=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "Error: Release APK not found!"
            exit 1
          fi
          ASSET_NAME="SpendWise-${TAG}.apk"
          cp "$APK_PATH" "$ASSET_NAME"
          echo "ASSET_NAME=$ASSET_NAME" >> $GITHUB_ENV
          echo "Generated APK: $ASSET_NAME"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: SpendWise ${{ env.TAG }}
          tag_name: ${{ env.TAG }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: ${{ env.ASSET_NAME }}
